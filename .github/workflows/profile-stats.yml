name: Generate GitHub Profile Stats

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Stats Cards
        uses: anuraghazra/github-readme-stats-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ranuga-anthony
          theme: radical
          show_icons: true
          # Generates both the overall stats card and your top languages card
          include: 'stats,top-langs' 

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update profile metrics visualizations" || exit 0
          git push
